<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Eigene schematische Storyboard-Demonstration</title>
  <desc id="desc">Drei frei gezeichnete Bildideen: Person im Raum, Nahaufnahme und Detail. Keine Darstellung einer realen Produktion.</desc>
  <rect width="900" height="300" fill="#15111e"/>
  <g fill="none" stroke="#cdbbe8" stroke-width="3">
    <rect x="20" y="40" width="265" height="150"/><rect x="317" y="40" width="265" height="150"/><rect x="614" y="40" width="265" height="150"/>
    <circle cx="152" cy="97" r="16"/><path d="M123 170v-44q29-24 58 0v44M20 171h265"/>
    <circle cx="449" cy="112" r="42"/><path d="M391 190q58-72 116 0"/>
    <path d="M650 161l23-31 23 12 12-25 34 18 35-32 39 22-16 34z"/>
  </g>
  <g fill="#eee6f8" font-family="sans-serif" font-size="18">
    <text x="20" y="28">1 · Raum / Totale</text><text x="317" y="28">2 · Ausdruck / Nah</text><text x="614" y="28">3 · Detail / Übergang</text>
    <text x="20" y="222">Position und Bewegung</text><text x="317" y="222">Gleiche Playbackfassung</text><text x="614" y="222">Anschluss an Bildfolge</text>
    <text x="20" y="276" font-size="16">Eigene Planungsskizze: Motive, Einstellungsgrößen und Übergänge für die Shotlist.</text>
  </g>
</svg>
