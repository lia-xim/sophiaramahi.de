<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Schematischer Vergleich von Querformat und Hochformat</title>
  <desc id="desc">Im Querformat liegen eine zentrale Figur und seitliche Motive im Bild. Der mittige Hochformat-Ausschnitt erhält die Figur und schneidet die seitlichen Motive ab.</desc>
